{% load i18n %}
<div class="d-flex align-items-center">
  <form id="lang-form" action="{% url 'set_language' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <input id="lang-value" name="language" type="hidden" value="{{ LANGUAGE_CODE }}">
  </form>
  <div class="dropdown">
    <button class="btn btn-warning btn-sm dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown" style="border-radius:20px;padding:6px 14px;">
      🌐 {{ LANGUAGE_CODE|upper }}
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow">
      <li><a class="dropdown-item lang-option" data-lang="en" href="#">🇬🇧 English</a></li>
      <li><a class="dropdown-item lang-option" data-lang="fr" href="#">🇫🇷 Français</a></li>
      <li><a class="dropdown-item lang-option" data-lang="es" href="#">🇪🇸 Español</a></li>
      <li><a class="dropdown-item lang-option" data-lang="pt" href="#">🇵🇹 Português</a></li>
      <li><a class="dropdown-item lang-option" data-lang="sw" href="#">🇹🇿 Kiswahili</a></li>
      <li><a class="dropdown-item lang-option" data-lang="ar" href="#">🇸🇦 العربية</a></li>
    </ul>
  </div>
</div>
<script>
document.querySelectorAll('.lang-option').forEach(function(el){
  el.addEventListener('click', function(e){
    e.preventDefault();
    document.getElementById('lang-value').value = this.dataset.lang;
    document.getElementById('lang-form').submit();
  });
});
</script>
