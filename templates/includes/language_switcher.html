{% load i18n %}
{% get_current_language as CUR_LANG %}
{% get_available_languages as LANGS %}
<select id="lang-switcher" onchange="switchLanguage(this.value)" style="padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);color:#fff;font-size:13px;cursor:pointer;min-width:130px">
{% for code, name in LANGS %}
<option value="{{ code }}" {% if code == CUR_LANG %}selected{% endif %} style="color:#000;background:#fff">
{% if code == 'en' %}🇬🇧 EN{% elif code == 'fr' %}🇫🇷 FR{% elif code == 'es' %}🇪🇸 ES{% elif code == 'pt' %}🇵🇹 PT{% elif code == 'sw' %}🇹🇿 SW{% elif code == 'ar' %}🇸🇦 AR{% else %}{{ code|upper }}{% endif %}
</option>
{% endfor %}
</select>

<script>
function switchLanguage(lang) {
  let path = window.location.pathname;
  // Replace /xx/ prefix with /lang/
  let newPath;
  if (path.length >= 3 && path[0] === '/' && path[2] === '/') {
    newPath = '/' + lang + path.substring(3);
  } else {
    newPath = '/' + lang + path;
  }
  // Keep query string (?next= etc)
  window.location.href = newPath + window.location.search;
}
</script>
