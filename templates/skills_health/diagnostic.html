{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>🛠️ Skills Health Dashboard</h1>
    
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>📚 Courses</h5>
                    <p>{{ total_courses }} courses</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>📝 Lessons</h5>
                    <p>{{ total_lessons }} lessons</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>👤 Users</h5>
                    <p>{{ total_users }} users</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
