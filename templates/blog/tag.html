{% extends 'base.html' %}

{% block title %}{{ tag.name }} - Blog{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">
        <h1 class="fw-bold mb-4">Tag: #{{ tag.name }}</h1>
        
        <div class="row">
            {% for post in posts %}
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5><a href="{% url 'blog:detail' post.slug %}">{{ post.title }}</a></h5>
                            <p>{{ post.excerpt|truncatewords:20 }}</p>
                            <small class="text-muted">{{ post.published_at|date }}</small>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>No posts with this tag.</p>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock %}
