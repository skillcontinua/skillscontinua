{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{{ lesson.title }}</h1>
    
    <!-- Force HTML rendering with autoescape off -->
    {% autoescape off %}
        {{ lesson.content }}
    {% endautoescape %}

    <!-- Progress Bar -->
    <div class="card mt-4">
        <div class="card-body">
            <h5>Your Progress</h5>
            <div class="progress">
                <div id="lessonProgress" class="progress-bar" style="width: 0%;">0%</div>
            </div>
            <button id="markCompleteBtn" class="btn btn-warning mt-3">
                Mark Lesson Complete
            </button>
        </div>
    </div>
</div>

<script>
document.getElementById('markCompleteBtn').addEventListener('click', function() {
    document.getElementById('lessonProgress').style.width = '100%';
    document.getElementById('lessonProgress').textContent = '100%';
    alert('Lesson marked as complete!');
});
</script>
{% endblock %}
