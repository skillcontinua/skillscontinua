{% if user.is_authenticated %}
  {% if is_enrolled %}
    <div style="background:#22c55e;color:white;padding:12px;border-radius:8px">
      ✓ Enrolled — <a href="{% url 'lesson_view' course.lessons.first.id %}" style="color:white;text-decoration:underline">Start Lesson 1: {{ course.lessons.first.title }}</a>
    </div>
  {% else %}
    <form method="post" action="{% url 'enroll_course' course.id %}">
      {% csrf_token %}
      <button type="submit">Enroll Now - Free</button>
    </form>
  {% endif %}
{% else %}
  <a href="{% url 'login' %}?next={{ request.path }}">Login to Enroll</a>
{% endif %}
