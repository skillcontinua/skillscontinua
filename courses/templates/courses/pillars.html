{% load i18n %}
<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t.pillars }} - SkillsContinua</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body { padding-top: 80px; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary fixed-top shadow">
  <div class="container">
    <a class="navbar-brand" href="/{{ current_lang }}/courses/">📚 SkillsContinua</a>
    <a href="/{{ current_lang }}/courses/" class="btn btn-light">← Back to Courses</a>
  </div>
</nav>
<div class="container">
  <h3 class="mt-3">{{ t.pillars }} ({{ pillars|length }}) - {{ t.pilot }}</h3>
  <div class="row">
    {% for p in pillars %}
    <div class="col-md-4 mb-3">
      <div class="card h-100">
        <div class="card-body">
          <h5>{{ p.name }}</h5>
          <p class="badge bg-primary">{{ p.num_courses }} courses</p>
          <p class="small">{{ p.description|truncatechars:100 }}</p>
          <a href="/{{ current_lang }}/courses/pillar/{{ p.slug }}/" class="btn btn-primary btn-sm">View {{ p.num_courses }} Courses →</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
