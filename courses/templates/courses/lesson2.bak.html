{% extends "base.html" %}

{% block content %}
<!-- RED TEST MESSAGE -->
<div style="background: red; color: white; padding: 15px; text-align: center; font-size: 20px; margin: 10px 0;">
    ✅ RED BOX TEST - If you see this, the template is working!
</div>
<!-- TEST MESSAGE -->
<div style="background: red; color: white; padding: 10px; text-align: center; font-size: 18px;">
    ✅ TEMPLATE IS LOADING! This is a test message.
</div>

<div class="container mt-4">
    <h1>{{ lesson.title }}</h1>
    <p>{{ lesson.content|safe }}</p>
    
    <!-- Simple Progress Bar -->
    <div class="card mt-4">
        <div class="card-body">
            <h5>Your Progress</h5>
            <div class="progress">
                <div id="lessonProgress" class="progress-bar" style="width: 0%;">0%</div>
            </div>
            <button id="markCompleteBtn" class="btn btn-warning mt-3" onclick="markLessonComplete({{ lesson.id }})">
                Mark Lesson Complete
            </button>
        </div>
    </div>
</div>

<script>
function markLessonComplete(lessonId) {
    document.getElementById('markCompleteBtn').textContent = '✅ Completed!';
    document.getElementById('lessonProgress').style.width = '100%';
    document.getElementById('lessonProgress').textContent = '100%';
    alert('Lesson marked as complete!');
}
</script>
{% endblock %}
