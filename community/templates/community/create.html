{% extends 'base.html' %}
{% block content %}
<div style="max-width:700px;margin:40px auto;padding:20px">
<h2>📝 Create Community Post</h2>
<form method="post" style="margin-top:20px">
{% csrf_token %}
{{ form.as_p }}
<button type="submit" style="background:#000;color:#fff;padding:12px 24px;border-radius:8px;border:none;font-weight:bold">Publish to Community</button>
<a href="/en/community/" style="margin-left:15px">Cancel</a>
</form>
</div>
{% endblock %}
