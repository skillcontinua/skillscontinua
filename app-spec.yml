alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: skillscontinua
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: starfish-app
region: fra
services:
- build_command: pip install -r requirements.txt
  environment_slug: python
  github:
    branch: main
    deploy_on_push: true
    repo: skillcontinua/skillscontinua
  http_port: 8080
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: skillscontinua
  run_command: gunicorn core.wsgi
  source_dir: /